
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form | My Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="form.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body>
    <header>
        <h1>Contact Form</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="work.html">Coursework</a>
            <a href="interests.html">Interests</a>
            <a href="experiments.html">Experiments</a>
            <!-- <a href="contact.html">Contact</a> -->
            <a href="form-no-js.html" >Contact Form</a>
            <a href="form-with-js.html" aria-current="page">Contact Form (JS)</a>
        </nav>

        <button type="button" id="theme-toggle" hidden>
            Switch to Dark Mode
        /button>

    </header>

    <main>
        <h2>Send Me a Message</h2>
        <p>Fill out the form below to contact me.</p>

        
    <form id="contact-form"
        action="https://httpbin.org/post"
        method="post">

        <div class="form-group">
            <label for="name">Name (required):</label>
            <input type="text" id="name" name="name"
                autocomplete="name"
                required minlength="1" maxlength="100"
                aria-describedby="name-error">
            <small id="name-error" class="field-error" hidden></small>
        </div>

        <div class="form-group">
            <label for="email">Email (required):</label>
            <input type="email" id="email" name="email"
                autocomplete="email" required
                aria-describedby="email-error">
            <small id="email-error" class="field-error" hidden></small>
        </div>

        <div class="form-group">
            <label for="comments">Comments (required):</label>
            <p id="comments-instructions">
                Please enter between 10 and 1000 characters.
            </p>
            <textarea id="comments" name="comments"
                    rows="5" required
                    minlength="10" maxlength="1000"
                    aria-describedby="comments-instructions comments-error comments-info"></textarea>
            <small id="comments-error" class="field-error" hidden></small>
        </div>

        <input type="hidden" name="possible_bot" value="true">
        <input type="hidden" name="form-errors"
            id="form-errors" value="[]">

        <div id="form-error-summary" role="status" hidden>
            <h3>Form Errors</h3>
            <ul id="form-error-list"></ul>
        </div>

        <p id="comments-info" aria-live="polite" hidden></p>

        <button type="submit">Send Message</button>
    </form>

    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
